# Publishes to npm when a version tag (v*) is pushed.
#
# Release flow (run locally):
#   npm version patch        # bumps package.json, commits, creates tag vX.Y.Z
#   git push --follow-tags   # pushes commit + tag, triggering this workflow
#
# The workflow publishes the version already in package.json — it does NOT
# bump versions. Keep the tag and package.json version in sync (npm version
# does this for you). Requires the NPM_TOKEN repo secret.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
